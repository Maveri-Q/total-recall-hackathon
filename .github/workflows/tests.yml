# Runs every test on every push and pull request. The badge at the top of the README shows the result.
# Tests are pure maths and logic (odds, scoring, grading, memory texts), so no keys are needed here.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
