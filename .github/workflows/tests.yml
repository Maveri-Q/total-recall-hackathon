# Checks every push and pull request: types, lint, then every test. The badge at the top of the README shows the result.
# No keys are needed: the tests cover the maths and logic, and the data job's failure cases use stand-ins for
# Tatum, The Odds API, Sui and Walrus.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Next.js writes the route types (page and layout props) during dev or build; typegen writes them on their own.
      - name: Types
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
